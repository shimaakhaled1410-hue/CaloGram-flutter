name: CaloGram CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: Lint, Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create mock environment files for CI
        run: |
          touch .env
          echo "GEMINI_API_KEY=mock_key" >> .env
          echo "GROQ_API_KEY=mock_key" >> .env
          cat << 'EOF' > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'mock',
                  appId: 'mock',
                  messagingSenderId: 'mock',
                  projectId: 'mock',
                );
          }
          EOF
          dart format lib/firebase_options.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test